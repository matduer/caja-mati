<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7A5C">
<meta name="color-scheme" content="light dark">
<title>Caja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna para el celular (máx. 560px). Navegación abajo: Inicio · Cuentas · Topes · Pagos · Registro, y botón + flotante para cargar. */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --sunk:#E2EAE5; --line:#C9D6CF;
  --fg:#13201A; --muted:#5A6B62; --accent:#0E7A5C; --accent-fg:#FFFFFF; --accent-soft:#D3EDE3;
  --fab:#E9B63B; --fab-fg:#2A1E00;
  --ok:#1E8A4C; --warn:#B7791F; --crit:#C2402F; --warn-soft:#F7EBD3; --crit-soft:#F6DCD7;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#15201B; --sunk:#1B2923; --line:#2A3B33;
  --fg:#E4EEE9; --muted:#93A69C; --accent:#3CC79A; --accent-fg:#06221A; --accent-soft:#163C30;
  --fab:#E9B63B; --fab-fg:#2A1E00;
  --ok:#4CC27F; --warn:#E3A84A; --crit:#EE7462; --warn-soft:#3A2E17; --crit-soft:#3D1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#15201B; --sunk:#1B2923; --line:#2A3B33;
  --fg:#E4EEE9; --muted:#93A69C; --accent:#3CC79A; --accent-fg:#06221A; --accent-soft:#163C30;
  --fab:#E9B63B; --fab-fg:#2A1E00;
  --ok:#4CC27F; --warn:#E3A84A; --crit:#EE7462; --warn-soft:#3A2E17; --crit-soft:#3D1F1A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:12px;font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.view{display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
header.top .back{border:0;background:none;padding:4px 8px 4px 0;font-size:22px;color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;padding:13px 16px;font-size:16px}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
button.danger{color:var(--crit)}
button:disabled{opacity:.5;cursor:not-allowed}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.under{display:flex;border-bottom:1px solid var(--line)}
.under button{flex:1;border:0;border-radius:0;background:none;padding:10px 4px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;border-bottom:2px solid transparent}
.under button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.periods{display:flex;justify-content:space-around;gap:4px}
.periods button{border:0;background:none;color:var(--muted);padding:6px 8px;font-size:14px;border-radius:8px}
.periods button[aria-pressed="true"]{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav button{border:0;background:none;font-size:22px;padding:2px 12px;color:var(--fg)}
.pnav button:disabled{opacity:.25}
.pnav strong{font-family:var(--f-display);font-size:17px;font-weight:600}
.balance{text-align:center;display:flex;flex-direction:column;gap:2px}
.balance span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.balance b{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.donut{display:flex;justify-content:center}
.donut svg{width:min(230px,70vw);height:auto}
.donut text{font-family:var(--f-display);fill:var(--fg)}
.split{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.split b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.cat{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;text-align:left}
.cat:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;color:#fff}
.cat .n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .p{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;width:42px;text-align:right}
.cat .m{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.amount{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.amount span{font-family:var(--f-display);font-size:28px;color:var(--muted);font-weight:600}
.amount input{border:0;background:transparent;font-family:var(--f-display);font-weight:800;font-size:36px;padding:0;letter-spacing:-.02em}
.amount input:focus-visible{outline:none}
.amount .calcb{white-space:nowrap;flex:none;border:0;background:var(--sunk);padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.amount .calcb[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keypad button{padding:12px 0;font-size:20px;font-family:var(--f-display);font-weight:600;background:var(--sunk);border:0}
.keypad button.op{color:var(--accent)} .keypad button.eq{background:var(--fab);color:var(--fab-fg)}
.acct{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);padding:10px 12px}
.acct .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}
.acct .nm{flex:1;min-width:0;font-weight:500}
.acct .bal{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:6px 2px;border-radius:12px;font-size:12px;line-height:1.2;text-align:center;color:var(--fg)}
.tile .ico{width:46px;height:46px;font-size:22px}
.tile[aria-pressed="true"]{background:var(--accent-soft);outline:2px solid var(--accent)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);grid-column:1/-1;margin-top:4px}
.dates{display:flex;gap:6px;align-items:stretch}
.dates button{flex:1;padding:6px 4px;font-size:13px;line-height:1.25;background:var(--bg)}
.dates button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.dates button small{display:block;font-size:11px;opacity:.85}
.sug{font-size:13px;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:6px 10px}
.need{font-size:13px;background:var(--warn-soft);border-radius:8px;padding:6px 10px}
.dsug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px;background:var(--surface)}
.dsug button{display:flex;justify-content:space-between;gap:8px;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:10px 12px;text-align:left;color:var(--fg);font-size:15px}
.dsug button:first-child{border-top:0}.dsug button small{color:var(--muted);font-family:var(--f-mono)}
.tag{font-size:11px;background:var(--crit-soft);color:var(--crit);border-radius:99px;padding:1px 7px;font-weight:600}
.warn-t{color:var(--warn);font-weight:600}
.papel{display:flex;align-items:center;gap:10px}.papel+.papel{border-top:1px solid var(--line)}.papel .mov{border-top:0}
.psel{flex-direction:row;padding:8px 0}.psel input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.cat.sub .n{white-space:normal}.cat.sub .m{text-align:right}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}
details.more[open] summary{margin-bottom:10px}
.toggle{display:flex;align-items:center;gap:10px;flex-direction:row;color:var(--fg);font-size:14px}
.toggle input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:-6px}
.day{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.mov{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;width:100%;text-align:left}
.mov .ico{width:32px;height:32px;font-size:15px}
.mov .d{flex:1;min-width:0}
.mov .d div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mov .m{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mov.ing .m{color:var(--ok)} .mov.arch{opacity:.5} .mov.neutral .m{color:var(--muted)}
.pend{background:var(--warn-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.pend .it{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pend .it span{flex:1 1 150px;min-width:0;font-size:14px}
.pend .it button{padding:6px 10px;font-size:13px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)}
.trow{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.trow .h span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.state{padding:24px 16px;text-align:center;color:var(--muted)}
.confirm{background:var(--crit-soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:13px 2px}
.menu button:first-child{border-top:0}
.menu small{color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs div{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:11px 4px 12px;color:var(--muted);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--fab);color:var(--fab-fg);border:0;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:10;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.chipsync{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);background:var(--surface)}
.chipsync i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.tline b{color:var(--fg)}
.big{font-size:26px;font-weight:800}
.act{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}.act .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:42px}
.act .w{flex:1;min-width:0}.act .k{font-size:12px;font-weight:600}.act .k.add{color:var(--ok)}.act .k.ed{color:var(--accent)}.act .k.del{color:var(--crit)}.act .k.arc{color:var(--warn)}
.act .m{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>

<div class="wrap" id="app"><div id="view" class="view"><div class="card state">Cargando…</div></div></div>
<button class="fab" id="fab" aria-label="Cargar movimiento" hidden>+</button>
<nav class="tabs" aria-label="Secciones"><div>
  <button data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Inicio</button>
  <button data-tab="cuentas"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Cuentas</button>
  <button data-tab="topes"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Topes</button>
  <button data-tab="pagos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Pagos</button>
  <button data-tab="mas"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Registro</button>
</div></nav>

<script>
// ================= almacenamiento local (IndexedDB) =================
// Imita la API mínima que usa la app: doc(path).get/set/update/onSnapshot y collection(path).doc()/onSnapshot.
const LocalDB=(()=>{let idb;const mem=new Map(),pend=new Map(),subs=new Set();let notifT=null;
  const tx=(m)=>idb.transaction(["docs","meta"],m);
  const done=t=>new Promise((ok,ko)=>{t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)});
  const rq=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
  function notify(){if(notifT)return;notifT=setTimeout(()=>{notifT=null;subs.forEach(f=>{try{f()}catch(e){console.error(e)}})},0)}
  async function write(path,data,pending){mem.set(path,data);if(pending)pend.set(path,(pend.get(path)||0)+1);
    const t=tx("readwrite");t.objectStore("docs").put(data,path);t.objectStore("meta").put(Object.fromEntries(pend),"pending");await done(t);notify();if(pending)Sync.soon()}
  const snapDoc=p=>({id:p.split("/").pop(),exists:mem.has(p),data:()=>mem.get(p),metadata:{fromCache:true,hasPendingWrites:pend.has(p)}});
  function docRef(p){return{id:p.split("/").pop(),path:p,
    get:async()=>snapDoc(p),
    set:async d=>write(p,structuredClone(d),true),
    update:async d=>{if(!mem.has(p))throw{code:"invalid_argument",message:"no existe"};return write(p,{...mem.get(p),...structuredClone(d)},true)},
    onSnapshot(n){const f=()=>n(snapDoc(p));subs.add(f);f();return()=>subs.delete(f)},
    collection:c=>colRef(p+"/"+c)}}
  function colDocs(c){const pre=c+"/",o=[];for(const k of mem.keys())if(k.startsWith(pre)&&!k.slice(pre.length).includes("/"))o.push(snapDoc(k));return o.sort((a,b)=>a.id<b.id?-1:1)}
  function colRef(c){return{path:c,doc:id=>docRef(c+"/"+(id||(Date.now().toString(36)+Math.random().toString(36).slice(2,10)))),
    add:async d=>{const r=docRef(c+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,10));await r.set(d);return r},
    onSnapshot(n){const f=()=>{const docs=colDocs(c);n({docs,size:docs.length,empty:!docs.length})};subs.add(f);f();return()=>subs.delete(f)},
    get:async()=>{const docs=colDocs(c);return{docs,size:docs.length,empty:!docs.length}}}}
  const api={doc:docRef,collection:colRef,has:p=>mem.has(p),raw:p=>mem.get(p),
    pendingCount:()=>pend.size,pendingSnapshot:()=>[...pend.entries()],
    async clearPending(list){list.forEach(([p,v])=>{if(pend.get(p)===v)pend.delete(p)});const t=tx("readwrite");t.objectStore("meta").put(Object.fromEntries(pend),"pending");await done(t);notify()},
    async putRemote(p,d){if(pend.has(p))return false;await write(p,d,false);return true},
    async meta(k,v){if(v===undefined){return rq(tx("readonly").objectStore("meta").get(k))}const t=tx("readwrite");t.objectStore("meta").put(v,k);await done(t)},
    async open(){idb=await new Promise((ok,ko)=>{const r=indexedDB.open("caja-mati",1);r.onupgradeneeded=()=>{r.result.createObjectStore("docs");r.result.createObjectStore("meta")};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
      const s=tx("readonly");const ks=await rq(s.objectStore("docs").getAllKeys()),vs=await rq(s.objectStore("docs").getAll());ks.forEach((k,i)=>mem.set(k,vs[i]));
      const p=await rq(s.objectStore("meta").get("pending"));if(p)Object.entries(p).forEach(([k,v])=>pend.set(k,v));return api}};
  return api})();

// ================= sincronización con la planilla (Apps Script) =================
const Sync={cfg:{url:"",key:"",last:0,err:""},busy:false,_t:null,
  async load(){const c=await LocalDB.meta("sync");if(c)this.cfg={...this.cfg,...c}},
  async save(){await LocalDB.meta("sync",this.cfg)},
  start(){window.addEventListener("online",()=>{render(false);this.all()});window.addEventListener("offline",()=>render(false));
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")this.all()});setInterval(()=>this.all(),60000);this.all()},
  // sincronización completa: sube lo pendiente y baja lo nuevo de la planilla (lo cargado en otro dispositivo)
  async all(){await this.push();await this.pullQuiet()},
  async pullQuiet(){if(this.pulling||!this.cfg.url||!navigator.onLine||this.busy)return;this.pulling=true;

      for(const d of j.docs){if(!d.path||!d.data)continue;const cur=LocalDB.raw(d.path);

    try{for(let i=0;i<snap.length;i+=150){const part=snap.slice(i,i+150);

function parseMonto(s){s=String(s||"").replace(/[\s$]/g,"");if(!s)return NaN;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");return parseFloat(s)}
function evalMonto(s){s=String(s||"").trim();if(!/[+\-*/×÷x]/.test(s.replace(/^-/,"")))return parseMonto(s);
  const e=s.replace(/[×x]/g,"*").replace(/÷/g,"/").replace(/[\d.,]+/g,t=>String(parseMonto(t)));
  if(!/^[\d.+\-*/() ]+$/.test(e))return NaN;const v=calcExpr(e);return isFinite(v)?Math.round(v*100)/100:NaN}
function calcExpr(src){const tk=src.replace(/\s+/g,"").match(/\d+(?:\.\d+)?|[+\-*/()]/g)||[];let i=0;
  const peek=()=>tk[i],next=()=>tk[i++];
  function prim(){const t=next();if(t==="(") {const v=sum();if(next()!==")")throw 0;return v}if(t==="-")return -prim();if(t==="+")return prim();const n=parseFloat(t);if(isNaN(n))throw 0;return n}
  function prod(){let v=prim();while(peek()==="*"||peek()==="/"){const o=next(),r=prim();v=o==="*"?v*r:v/r}return v}
  function sum(){let v=prod();while(peek()==="+"||peek()==="-"){const o=next(),r=prod();v=o==="+"?v+r:v-r}return v}
  try{const v=sum();return i===tk.length?v:NaN}catch{return NaN}}

  return o}
function totalCuentas(sl){return Object.values(sl).filter(s=>s.c.incluir&&!s.c.archivada&&(s.c.moneda||"ARS")==="ARS").reduce((a,s)=>a+s.v,0)}

// ================= período (Inicio) =================
function rango(){const h=S.home,f=h.ref;
  if(h.per==="dia")return{desde:f,hasta:addDias(f,1),label:f===hoyISO()?"Hoy":cap(new Date(f+"T12:00").toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}))};
  if(h.per==="semana"){const l=lunesISO(f);return{desde:l,hasta:addDias(l,7),label:`${fCorta(l)} – ${fCorta(addDias(l,6))}`}}
  if(h.per==="anio"){const y=f.slice(0,4);return{desde:`${y}-01-01`,hasta:`${+y+1}-01-01`,label:y}}
  const m=mesDe(f);return{desde:m+"-01",hasta:addMes(m,1)+"-01",label:nombreMes(m)}}
function periodoMeses(){const r=rango();return mesesEntre(mesDe(r.desde),mesDe(addDias(r.hasta,-1)))}
function moverPeriodo(k){const h=S.home,f=h.ref;
  h.ref=h.per==="dia"?addDias(f,k):h.per==="semana"?addDias(f,7*k):h.per==="anio"?`${+f.slice(0,4)+k}${f.slice(4)}`:addMes(mesDe(f),k)+"-01";ensureSubs();render(true)}
function movsPeriodo(){const r=rango();return periodoMeses().flatMap(movsDe).filter(x=>!x.archivado&&x.fecha>=r.desde&&x.fecha<r.hasta)}
function agrupar(xs,tipo){const o={};
  for(const x of xs){if(tipo==="gasto"){if(x.tipo==="gasto")o[x.rubro]=(o[x.rubro]||0)+x.monto;else if(x.tipo==="ingreso"&&x.ingTipo==="Reintegro")o[x.rubro]=(o[x.rubro]||0)-x.monto}
    else if(x.tipo==="ingreso"&&x.ingTipo!=="Reintegro")o[x.ingTipo]=(o[x.ingTipo]||0)+x.monto}
  return Object.entries(o).filter(([,v])=>Math.abs(v)>.5).sort((a,b)=>b[1]-a[1])}
function donut(parts,total){const R=80,C=2*Math.PI*R;let off=0;const pos=parts.filter(([,v])=>v>0);const sum=pos.reduce((a,[,v])=>a+v,0)||1;
  const segs=pos.map(([k,v])=>{const len=v/sum*C;const s=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${(ICO[k]||[0,"#7F8C8D"])[1]}" stroke-width="26" stroke-dasharray="${Math.max(len-1.5,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len;return s}).join("");
  return `<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Total ${esc(fmt(total))}"><circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--sunk)" stroke-width="26"/>${segs}<text x="100" y="108" text-anchor="middle" font-size="24" font-weight="800">${esc(fmtC(total))}</text></svg></div>`}

// ================= pagos habituales =================
// Cada pago habitual genera "ocurrencias" en el mes (una si es mensual, una por semana si es semanal).
// Una ocurrencia está hecha si hay un gasto cargado desde el aviso o, si no, uno cargado a mano con el mismo rubro y la palabra principal de la descripción
// (para semanales, en la misma semana). Cada gasto cubre una sola ocurrencia.
const DSEM=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function ocurrencias(h,m){const ult=new Date(+m.slice(0,4),+m.slice(5),0).getDate();
  if(h.frec==="semanal"){const o=[];for(let d=1;d<=ult;d++){const f=`${m}-${pad(d)}`;if(new Date(f+"T12:00").getDay()===(h.dsem??5))o.push(f)}return o}
  return [`${m}-${pad(Math.min(h.dia||1,ult))}`]}
const palabraClave=s=>(norm(s).replace(/\(.*?\)/g," ").split(/[^a-z0-9ñ]+/).filter(w=>w.length>2)[0])||norm(s);
function estadoHab(){const m=mesDe(hoyISO());const xs=movsDe(m).filter(x=>x.tipo==="gasto"&&!x.archivado);const usados=new Set();
  const occ=[];S.hab.items.filter(h=>h.activo).forEach(h=>ocurrencias(h,m).forEach(f=>occ.push({h,f,key:h.id+"@"+f})));
  occ.sort((a,b)=>a.f.localeCompare(b.f));
  const enRango=(o,x)=>o.h.frec!=="semanal"||lunesISO(x.fecha)===lunesISO(o.f);
  for(const o of occ){const x=xs.find(x=>!usados.has(x.id)&&x.habitual===o.h.id&&enRango(o,x));if(x){usados.add(x.id);o.hecho=x}}
  for(const o of occ){if(o.hecho)continue;const k=palabraClave(o.h.desc);
    const x=xs.find(x=>!usados.has(x.id)&&!x.habitual&&x.rubro===o.h.rubro&&enRango(o,x)&&norm(x.desc).includes(k));if(x){usados.add(x.id);o.hecho=x}}
  const salt=new Set(S.hab.saltados);
  return occ.map(o=>({...o.h,fecha:o.f,occ:o.key,hecho:!!o.hecho,salteado:salt.has(o.key)||(o.h.frec!=="semanal"&&salt.has(o.h.id+"@"+m))}))}
function pendientes(){const hoy=hoyISO();return estadoHab().filter(o=>!o.hecho&&!o.salteado&&o.fecha<=hoy)}
function proximos(){const hoy=hoyISO();return estadoHab().filter(o=>!o.hecho&&!o.salteado&&o.fecha>hoy)}
const cuandoHab=h=>h.frec==="semanal"?`cada ${DSEM[h.dsem??5]}`:`día ${h.dia}`;
function fechaHab(h){const m=mesDe(hoyISO());const ult=new Date(+m.slice(0,4),+m.slice(5),0).getDate();return `${m}-${pad(Math.min(h.dia||1,ult))}`}
function movDesdeHab(h,monto,fecha){fecha=fecha||fechaHab(h);return{tipo:"gasto",fecha,mes:mesDe(fecha),cuenta:h.cuenta,nota:"",origen:"app",archivado:false,moneda:"ARS",monto,
  rubro:h.rubro,persona:h.persona||personaDef(h.rubro),grupo:RUBROS[h.rubro],desc:h.desc,compartida:null,habitual:h.id,creado:Date.now(),actualizado:Date.now()}}

// ================= vistas: Inicio =================
function vInicio(){const h=S.home,r=rango(),xs=movsPeriodo(),sl=saldos();
  const parts=agrupar(xs,h.tipo),total=parts.reduce((a,[,v])=>a+v,0);
  const cons=xs.filter(x=>x.tipo==="gasto"&&!["Ahorro","Fuera del gasto"].includes(RUBROS[x.rubro])).reduce((a,x)=>a+x.monto,0)-xs.filter(x=>x.tipo==="ingreso"&&x.ingTipo==="Reintegro"&&!["Ahorro","Fuera del gasto"].includes(RUBROS[x.rubro])).reduce((a,x)=>a+x.monto,0);
  const ahorro=xs.filter(x=>x.tipo==="gasto"&&RUBROS[x.rubro]==="Ahorro").reduce((a,x)=>a+x.monto,0);
  const pend=pendientes();const loaded=periodoMeses().every(m=>S.movs[m]!==undefined);
  const futuro=r.hasta>addDias(hoyISO(),1)&&r.desde>hoyISO();
  return `<header class="top"><h1>Caja ${esc(YO())}</h1>${syncChip()}</header>
  ${!Sync.cfg.url?`<div class="need">Conectá tu planilla para traer tus cuentas y pagos habituales, y para que lo que cargues quede respaldado. <button type="button" class="ghost" data-go="sync">Configurar</button></div>`:Sync.alerta()?`<div class="need">${esc(Sync.alerta())} <button type="button" class="ghost" data-go="sync">Ver</button></div>`:""}
  <div class="balance"><span>Total en cuentas</span><b class="num">${esc(fmt(totalCuentas(sl)))}</b></div>
  ${pend.length?`<div class="pend"><b class="small">Pagos habituales para confirmar</b>${pend.slice(0,4).map(p=>`<div class="it"><span>${esc(p.desc)} · ${esc(fCorta(p.fecha))} · ${esc(fmt(p.monto))}</span><button type="button" data-hab-ok="${p.occ}">Cargar</button><button type="button" data-hab-edit="${p.occ}">Revisar</button><button type="button" class="ghost" data-hab-skip="${p.occ}">Saltear</button></div>`).join("")}${pend.length>4?`<button type="button" class="ghost" data-go="habituales">Ver los ${pend.length}</button>`:""}</div>`:""}
  ${cardProximos()}
  <div class="card" style="gap:10px">
   <div class="under">${[["gasto","Gastos"],["ingreso","Ingresos"]].map(([k,t])=>`<button type="button" data-htipo="${k}" aria-pressed="${h.tipo===k}">${t}</button>`).join("")}</div>
   <div class="periods">${[["dia","Día"],["semana","Semana"],["mes","Mes"],["anio","Año"]].map(([k,t])=>`<button type="button" data-per="${k}" aria-pressed="${h.per===k}">${t}</button>`).join("")}</div>
   <div class="pnav"><button type="button" data-pmov="-1" aria-label="Anterior">‹</button><strong>${esc(r.label)}</strong><button type="button" data-pmov="1" aria-label="Siguiente">›</button></div>
   ${!loaded?`<div class="state">Cargando…</div>`:parts.length?donut(parts,total)+(h.tipo==="gasto"?`<div class="split"><span>Consumo <b>${esc(fmt(cons))}</b></span>${ahorro?`<span>Ahorro e inversión <b>${esc(fmt(ahorro))}</b></span>`:""}</div>`:""):`<div class="state">${futuro?"Período futuro.":`Sin ${h.tipo==="gasto"?"gastos":"ingresos"} en este período.`} Tocá <b>+</b> para cargar.</div>`}
  </div>
  ${parts.length?`<div class="card" style="padding-block:6px"><div>${parts.map(([k,v])=>`<button type="button" class="cat" data-rub="${esc(k)}">${ico(k)}<span class="n">${esc(k)}</span><span class="p">${total?Math.round(v/total*100):0}%</span><span class="m">${esc(fmt(v))}</span></button>`).join("")}</div>
   <button type="button" class="ghost" data-go="lista">Ver todos los movimientos</button></div>`:""}`}

// ================= lista de movimientos =================
function movRow(x){
  const sl=S._sl||{};let k,meta,sign="",cls="",monto=x.monto,mon="ARS",desc=x.desc;
  if(x.tipo==="transferencia"){k="Transferencia";desc=`${x.desde} → ${x.hacia}`;meta=[x.nota||null];cls="neutral";mon=(cuentaPorNombre(x.desde)||{}).moneda||"ARS"}
  else if(x.tipo==="ajuste"){k="Ajuste de saldo";desc=`Ajuste ${x.cuenta}`;meta=[x.nota||null];cls="neutral";sign=x.monto>=0?"+":"−";monto=Math.abs(x.monto)}
  else if(x.tipo==="ingreso"){k=x.ingTipo;meta=[x.ingTipo==="Reintegro"?"reintegro de "+x.rubro:x.ingTipo,x.cuenta];sign=x.ingTipo==="Reintegro"?"−":"+";cls="ing"}
  else{k=x.rubro;meta=[x.rubro,x.persona&&x.persona!==YO()?x.persona:null,x.cuenta,x.moneda==="USD"?"US$ "+x.montoOrig:null,x.compartida?"mi parte de "+fmt(x.compartida.total):null]}
  if(x.archivado)meta.push("archivado");
  return `<button type="button" class="mov ${cls} ${x.archivado?"arch":""}" data-edit="${esc(x.mes)}|${esc(x.id)}">${ico(k)}<div class="d"><div>${esc(desc)}</div><div class="small muted">${meta.filter(Boolean).map(esc).join(" · ")}</div></div><div class="m">${sign}${esc(fmt(monto,mon))}</div></button>`}
function listaPorDia(xs){const byDay={};xs.sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0)).forEach(x=>(byDay[x.fecha]=byDay[x.fecha]||[]).push(x));
  return Object.keys(byDay).map(d=>{const tot=byDay[d].filter(x=>x.tipo==="gasto"&&!x.archivado).reduce((s,x)=>s+x.monto,0);
    return `<div class="day"><span>${esc(new Date(d+"T12:00").toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"}))}</span><span class="num">${tot?esc(fmt(tot)):""}</span></div>`+byDay[d].map(movRow).join("")}).join("")}
function vLista(p){const r=rango();let xs=periodoMeses().flatMap(movsDe).filter(x=>x.fecha>=r.desde&&x.fecha<r.hasta&&(S.showArch||!x.archivado));
  let titulo="Movimientos";
  if(p.rubro){titulo=p.rubro;xs=xs.filter(x=>(S.home.tipo==="gasto"?(x.rubro===p.rubro&&(x.tipo==="gasto"||x.ingTipo==="Reintegro")):(x.tipo==="ingreso"&&x.ingTipo===p.rubro)))}
  if(p.cuenta){titulo=p.cuenta;xs=todosMovs().filter(x=>(S.showArch||!x.archivado)&&(x.cuenta===p.cuenta||x.desde===p.cuenta||x.hacia===p.cuenta)).filter(x=>x.fecha<=hoyISO()).slice(0,400)}
  if(p.transf){titulo="Historial de transferencias";xs=todosMovs().filter(x=>x.tipo==="transferencia"&&(S.showArch||!x.archivado))}
  const nArch=xs.filter(x=>x.archivado).length;
  return `<header class="top"><button type="button" class="back" data-back aria-label="Volver">←</button><h2 style="flex:1">${esc(titulo)}</h2>${p.cuenta||p.transf?"":`<span class="small muted">${esc(r.label)}</span>`}</header>
  <div class="card">${xs.length?`<div>${listaPorDia(xs)}</div>`:`<div class="state">No hay movimientos.</div>`}
  <label class="toggle small"><input type="checkbox" id="iArch" ${S.showArch?"checked":""}>Mostrar archivados${nArch?` (${nArch})`:""}</label>
  ${p.cuenta||p.transf?"":`<button type="button" class="ghost" data-act="csv">Copiar como CSV</button>`}</div>`}

// ================= Cargar =================
function nuevoForm(){const c=cuentas()[0];return{tipo:"gasto",moneda:"ARS",monto:"",desc:"",rubro:null,persona:null,cuenta:c?c.nombre:"",fecha:hoyISO(),cuotas:1,compartida:false,total:"",ingTipo:"Sueldo",usd:"",tcGasto:"",nota:"",touchedRubro:false,touchedPersona:false,habitual:null}}
function formDesdeMov(x){return{tipo:x.tipo,moneda:x.moneda||"ARS",monto:String(x.moneda==="USD"?x.montoOrig:(x.compartida?x.compartida.miParte:x.monto)),desc:x.desc,rubro:x.rubro||null,persona:x.persona||null,cuenta:x.cuenta,fecha:x.fecha,cuotas:1,compartida:!!x.compartida,total:x.compartida?String(x.compartida.total):"",ingTipo:x.ingTipo||"Sueldo",usd:x.usd?String(x.usd):"",tcGasto:x.tc?String(x.tc):"",nota:x.nota||"",touchedRubro:true,touchedPersona:true,habitual:x.habitual||null}}
function frecuentes(sel){const cnt={};todosMovs().forEach(x=>{if(x.tipo==="gasto"&&!x.archivado&&x.creado)cnt[x.rubro]=(cnt[x.rubro]||0)+1});
  let top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);FRECUENTES_DEF.forEach(r=>{if(!top.includes(r))top.push(r)});top=top.filter(r=>RUBROS[r]).slice(0,7);
  if(sel&&!top.includes(sel))top=[sel,...top.slice(0,6)];return top}
function vCargar(){

  const tile=r=>`<button type="button" class="tile" data-rubro="${esc(r)}" aria-pressed="${f.rubro===r}">${ico(r)}<span>${esc(r)}</span></button>`;
  const grid=S.showAllRub?GRUPOS.map(g=>`<div class="grp">${g}</div>`+Object.keys(RUBROS).filter(r=>RUBROS[r]===g).map(tile).join("")).join("")+`<button type="button" class="tile" data-act="menosRub"><span class="ico" style="background:var(--sunk);color:var(--fg)">−</span><span>Menos</span></button>`
    :frecuentes(f.rubro).map(tile).join("")+`<button type="button" class="tile" data-act="masRub"><span class="ico" style="background:var(--sunk);color:var(--fg)">+</span><span>Más</span></button>`;
  const h=hoyISO(),dts=[[h,"hoy"],[addDias(h,-1),"ayer"],[addDias(h,-2),"anteayer"]];const otra=!dts.some(([d])=>d===f.fecha);
  const fd=d=>{const x=new Date(d+"T12:00");return `${x.getDate()}/${x.getMonth()+1}`};
  return `<header class="top"><button type="button" class="back" data-back aria-label="Volver">←</button><h2 style="flex:1">${ed?"Editar movimiento":"Añadir movimiento"}</h2></header>
  <form class="card" id="fMov" autocomplete="off">
   <div class="under">${[["gasto","Gasto"],["ingreso","Ingreso"]].map(([t,l])=>`<button type="button" data-tipo="${t}" aria-pressed="${f.tipo===t}">${l}</button>`).join("")}</div>
   ${!esGasto?`<div class="seg" role="group" aria-label="Tipo de ingreso">${ING_TIPOS.map(t=>`<button type="button" data-ingtipo="${t}" aria-pressed="${f.ingTipo===t}">${t}</button>`).join("")}</div>`:""}
   <div class="amount"><span>${f.moneda==="USD"?"US$":"$"}</span><input id="iMonto" inputmode="decimal" placeholder="0" value="${esc(f.monto)}" aria-label="${f.compartida?"Mi parte":"Monto"}"><button type="button" class="calcb" data-act="calc" aria-pressed="${S.calc}" aria-label="Calculadora">+−×÷</button></div>
   ${S.calc?`<div class="keypad">${["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+",",","0","⌫","="].map(k=>`<button type="button" data-key="${k}" class="${"÷×−+()".includes(k)?"op":k==="="?"eq":""}">${k}</button>`).join("")}</div>`:""}
   ${f.compartida?`<div class="hint">Esto es tu parte. Lo que pagaste en total va en Más opciones.</div>`:""}
   <div><label style="margin-bottom:4px">Cuenta</label>
    <button type="button" class="acct" data-act="pickCuenta" aria-expanded="${S.pickCuenta}">${dotCta(cta)}<span class="nm">${esc(f.cuenta||"Elegí una cuenta")}</span><span class="bal">${sl[f.cuenta]&&sl[f.cuenta].ok?esc(fmt(sl[f.cuenta].v,cta&&cta.moneda)):""}</span><span aria-hidden="true">▾</span></button>

   ${esGasto||f.ingTipo==="Reintegro"?`<div><label style="margin-bottom:6px">Rubro</label>
     ${sg?`<div class="sug" style="margin-bottom:8px">Sugerido por ${sg.por}: <b>${esc(sg.rubro)}</b>${sg.persona?" · "+esc(sg.persona):""}. Tocá otro si no es.</div>`:(!f.rubro&&f.desc?`<div class="need" style="margin-bottom:8px">No reconozco esta descripción: elegí el rubro.</div>`:"")}
     <div class="grid" role="group" aria-label="Rubro">${grid}</div></div>

   <div><label style="margin-bottom:6px">Fecha</label><div class="dates">${dts.map(([d,t])=>`<button type="button" data-fecha="${d}" aria-pressed="${f.fecha===d}">${fd(d)}<small>${t}</small></button>`).join("")}

   ${!esGasto&&f.ingTipo==="Sueldo"?`<label>USD vendidos<input id="iUsd" inputmode="decimal" placeholder="ej. 500" value="${esc(f.usd)}"></label><div class="hint">El monto de arriba son los pesos que recibiste.</div>`:""}
   <div><label>Comentario<input id="iDesc" placeholder="${esGasto?"ej. medialunas con Oppel":"ej. devolución de Juan"}" value="${esc(f.desc)}" autocomplete="off"></label><div class="dsug" id="descSug" hidden></div></div>
   ${esGasto?`<details class="more" ${f.cuotas>1||f.compartida||f.nota||f.moneda==="USD"?"open":""}><summary>Más opciones: cuotas, dólares, salida compartida</summary>

     ${f.cuotas>1?`<div class="hint">El monto es el total. Se carga una cuota por mes desde ${esc(nombreMes(mesDe(f.fecha)))}.</div>`:""}`}
     <label class="toggle"><input type="checkbox" id="iComp" ${f.compartida?"checked":""}>Salida compartida: pagué todo y me devuelven en el momento</label>
     ${f.compartida?`<label>Total que pagué<input id="iTotal" inputmode="decimal" value="${esc(f.total)}" placeholder="ej. 143.479"></label><div class="hint">Se cuenta solo tu parte. Si no te devuelven enseguida, cargá el total y después la devolución como ingreso.</div>`:""}
     <label>Nota<input id="iNota" value="${esc(f.nota)}" placeholder="opcional"></label></div></details>`:`<label>Nota<input id="iNota" value="${esc(f.nota)}" placeholder="opcional"></label>`}
   <button class="primary" type="submit" id="bGuardar">${ed?"Guardar cambios":"Añadir"}</button>
   ${ed?archBloque(ed):""}

async function guardar(){

    }else docs.push({...base,monto:pesos});

    if(f.ingTipo==="Sueldo"){const u=parseMonto(f.usd);base.usd=u>0?u:null;base.tc=u>0?Math.round(n/u*100)/100:null}

      else await S.db.doc(`meses/${ed.mes}/movs/${ed.id}`).set(nuevo);toast("Cambios guardados")}
    else{for(const d of docs){d.creado=Date.now();subMes(d.mes);await S.db.collection(`meses/${d.mes}/movs`).doc().set(d)}toast(docs.length>1?`Guardado en ${docs.length} cuotas`:"Guardado")}
  }catch(e){toast("No se guardó: "+(e.message||e.code));btn.disabled=false;return}

  if(esGasto&&f.desc.trim()){const k=norm(f.desc);const S0=S.memo;S.memo=S0.filter(x=>x[0]!==k);const rs=suggest(f.desc);S.memo=S0;
    if(!rs||rs.rubro!==f.rubro||(rs.persona&&rs.persona!==persona)){S.memo=[[k,f.rubro,persona],...S0.filter(x=>x[0]!==k)].slice(0,400);
      S.db.doc("config/memo").set({items:S.memo.map(x=>({k:x[0],r:x[1],p:x[2]}))}).catch(()=>{})}}
  S.editing=null;S.form=null;S.calc=false;S.showAllRub=false;S.otraFecha=false;back()}

  <button type="button" data-go="ajustes">Ajustar topes</button>

// ================= Pagos: suscripciones y pagos habituales =================
// Pagos agrupados: junta suscripciones/débitos y pagos habituales (sin repetir los que están en las dos listas).
const GRUPO_PAGO=[["Suscripciones",["Suscripciones","Ajedrez"]],["Servicios",["Servicios","Celular","Limpieza"]],["Salud",["Prepaga","Terapia","Salud","Gimnasio"]],["Impuestos",["Monotributo"]],["Vivienda",["Alquiler","Caja de seguridad"]]];
function grupoPago(r){const g=GRUPO_PAGO.find(([,rs])=>rs.includes(r));return g?g[0]:"Otros"}
function pagosAgrupados(){const tc=S.config.params.tc||1600;const out=[];const hoy=hoyISO();const est=estadoHab();
  const habs=S.hab.items.filter(h=>h.activo);
  for(const h of habs){const occ=est.filter(o=>o.id===h.id);const prox=occ.find(o=>!o.hecho&&!o.salteado&&o.fecha>=hoy);const hecho=occ.length&&occ.every(o=>o.hecho||o.salteado);
    out.push({nombre:h.desc,rubro:h.rubro,mes:h.frec==="semanal"?h.monto*4.33:+h.monto,monto:+h.monto,moneda:"ARS",cuando:cuandoHab(h)+(prox?` · próximo ${fCorta(prox.fecha)}`:hecho?" · listo este mes":""),habe:h.id,k:palabraClave(h.desc)})}
  for(const s of subsItems().filter(s=>s.estado!=="cancelada")){const k=palabraClave(s.servicio);const c=subCalc(s);
    const ya=out.find(o=>o.k===k);if(ya){ya.sube=s.id;if(c.prox&&!ya.cuando.includes("próximo"))ya.cuando+=` · próximo ${fCorta(c.prox)}`;continue}
    const ars=s.moneda==="USD"?+s.monto*tc:+s.monto;const per=FRECS[s.frec]||1;
    out.push({nombre:s.servicio,rubro:s.rubro,mes:ars/per,monto:+s.monto,moneda:s.moneda,cuando:(s.frec==="mensual"?"mensual":s.frec)+(c.prox?` · próximo ${fCorta(c.prox)}`:""),sube:s.id,k})}
  const grupos=[...GRUPO_PAGO.map(g=>g[0]),"Otros"].map(g=>({g,xs:out.filter(o=>grupoPago(o.rubro)===g)})).filter(x=>x.xs.length);
  grupos.forEach(x=>{x.xs.sort((a,b)=>b.mes-a.mes);x.total=x.xs.reduce((a,o)=>a+o.mes,0)});return grupos}
function vPagos(){const pend=pendientes();const G=pagosAgrupados();const tot=G.reduce((a,x)=>a+x.total,0);
  return `<header class="top"><h1>Pagos</h1></header>
  ${pend.length?`<div class="pend"><b class="small">Pagos habituales para confirmar</b>${pend.map(p=>`<div class="it"><span>${esc(p.desc)} · ${esc(fCorta(p.fecha))} · ${esc(fmt(p.monto))}</span><button type="button" data-hab-ok="${p.occ}">Cargar</button><button type="button" data-hab-edit="${p.occ}">Revisar</button><button type="button" class="ghost" data-hab-skip="${p.occ}">Saltear</button></div>`).join("")}</div>`:""}
  <div class="balance"><span>Pagos fijos por mes (aprox.)</span><b class="num">${esc(fmt(tot))}</b></div>
  ${G.map(x=>`<div class="card" style="padding-block:6px"><div class="h" style="display:flex;justify-content:space-between;align-items:baseline;padding-top:8px"><h3>${esc(x.g)}</h3><span class="small num">${esc(fmt(x.total))}/mes</span></div>
   ${x.xs.map(o=>`<button type="button" class="cat" ${o.habe?`data-habe="${o.habe}"`:`data-sube="${esc(o.sube)}"`}>${ico(o.rubro)}<span class="n">${esc(o.nombre)}<br><small class="muted">${esc(o.cuando)}</small></span><span class="m">${esc(fmt(o.monto,o.moneda))}</span></button>`).join("")}</div>`).join("")}
  <div class="card menu" style="padding-block:4px">
   <button type="button" data-go="subs"><span>Administrar suscripciones y débitos</span><small>${subsItems().filter(s=>s.estado!=="cancelada").length} activos</small></button>
   <button type="button" data-go="habituales"><span>Administrar pagos habituales</span><small>${S.hab.items.filter(h=>h.activo).length} activos</small></button>
  </div>
  <p class="small muted" style="margin:0">Junta las suscripciones y los pagos habituales. Los semanales cuentan ×4,33; los anuales, ÷12; los en dólares, al dólar de la proyección.</p>`}
// ================= Actividad =================
// Se arma con las marcas que ya tiene cada movimiento (creado, actualizado, borrado, eliminado), así se ve igual en todos los dispositivos.
function vActividad(){const hoy=hoyISO(),m0=mesDe(hoy);needMeses([m0,addMes(m0,-1),addMes(m0,-2)]);
  const desde=Date.now()-45*864e5;const ev=[];
  for(const [m,xs] of Object.entries(S.movs))for(const x of xs||[]){
    const desc=x.tipo==="transferencia"?`${x.desde} → ${x.hacia}`:x.tipo==="ajuste"?`Ajuste de saldo · ${x.cuenta}`:(x.desc||x.rubro||"");
    const monto=x.monto!=null?fmt(x.moneda==="USD"&&x.montoOrig?x.montoOrig:Math.abs(x.monto),x.moneda==="USD"&&x.montoOrig?"USD":"ARS"):"";
    if(x.eliminado){if(x.actualizado)ev.push({ts:x.actualizado,k:"del",que:"Eliminado para siempre",desc:"(sin datos)",monto:"",mes:m});continue}
    if(x.creado)ev.push({ts:x.creado,k:"add",que:x.habitual?"Cargado (pago habitual)":"Cargado",desc,monto,mes:m,fecha:x.fecha});
    if(x.borrado)ev.push({ts:x.borrado,k:"del",que:"A la papelera",desc,monto,mes:m});
    else if(x.archivado&&x.actualizado)ev.push({ts:x.actualizado,k:"arc",que:x.movidoA?"Pasado a otro mes":"Archivado",desc,monto,mes:m});
    else if(x.actualizado&&(!x.creado||x.actualizado-x.creado>3000)&&x.creado)ev.push({ts:x.actualizado,k:"ed",que:"Editado",desc,monto,mes:m});}
  const xs=ev.filter(e=>e.ts>=desde).sort((a,b)=>b.ts-a.ts).slice(0,300);const porDia={};
  xs.forEach(e=>{const d=isoDate(new Date(e.ts));(porDia[d]=porDia[d]||[]).push(e)});
  return `<header class="top"><button type="button" class="back" data-back aria-label="Volver">←</button><h2 style="flex:1">Actividad</h2></header>
  <p class="small muted" style="margin:0">Lo que se cargó, cambió, archivó o borró en los últimos 45 días, en todos tus dispositivos. De cada movimiento se ve cuándo se cargó y su último cambio.</p>
  ${xs.length?Object.entries(porDia).map(([d,es])=>`<div class="card" style="padding-block:6px"><h3 style="padding-top:8px">${esc(d===hoy?"Hoy":cap(new Date(d+"T12:00").toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"short"})))}</h3>
   ${es.map(e=>`<div class="act"><span class="t">${esc(new Date(e.ts).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}))}</span><div class="w"><div class="k ${e.k}">${esc(e.que)}</div><div class="small">${esc(e.desc)}${e.fecha?` <span class="muted">· ${esc(fCorta(e.fecha))}</span>`:""}</div></div><span class="m">${esc(e.monto)}</span></div>`).join("")}</div>`).join("")
   :`<div class="card state">Todavía no hay actividad registrada.</div>`}`}
function vHabituales(){const pend=pendientes(),prox=proximos();const act=S.hab.items.filter(h=>h.activo),inac=S.hab.items.filter(h=>!h.activo);

    return abrirCargar(formDesdeMov(x),x)}
  if(d.habOk){const[hid,hf]=d.habOk.split("@");const h=S.hab.items.find(x=>x.id===hid);if(!h)return;try{const m=movDesdeHab(h,+h.monto,hf);subMes(m.mes);await S.db.collection(`meses/${m.mes}/movs`).doc().set(m);toast(`${h.desc} cargado`)}catch(err){toast("No se guardó: "+(err.message||err.code))}return}
  if(d.habEdit){const[hid,hf]=d.habEdit.split("@");const h=S.hab.items.find(x=>x.id===hid);if(!h)return;const fm=nuevoForm();Object.assign(fm,{monto:String(h.monto),desc:h.desc,rubro:h.rubro,persona:h.persona,cuenta:h.cuenta,fecha:hf||fechaHab(h),touchedRubro:true,touchedPersona:true,habitual:h.id});return abrirCargar(fm)}
  if(d.habSkip){S.hab.saltados=[...S.hab.saltados,d.habSkip].slice(-200);try{await guardarHab();toast("Salteado")}catch{}render(true);return}
  if(d.color&&S.ce){leerCta();S.ce.color=d.color;return render(true)}
  if(d.dsug!==undefined&&S.form){leerForm();S.form.desc=d.dsug;if(!S.form.touchedRubro){const sg=suggest(d.dsug);S.form.rubro=sg?sg.rubro:null;if(!S.form.touchedPersona)S.form.persona=sg?(sg.persona||personaDef(sg.rubro)):null}render(true);const b=document.getElementById("descSug");if(b)b.hidden=true;return}
  if(d.sube){S.se=null;return go("subEdit",{id:d.sube})}
  if(d.subpay)return subPagar(d.subpay);
  if(d.recup){const[m,id]=d.recup.split("|");try{await S.db.doc(`meses/${m}/movs/${id}`).update({archivado:false,borrado:null,actualizado:Date.now()});toast("Recuperado")}catch(err){return toast("No se pudo: "+(err.message||err.code))}return scr().name==="papelItem"?back():render(true)}
  if(d.papel){S.confirmElim=false;return go("papelItem",{k:d.papel})}
  // formulario de carga
  if(f&&scr().name==="cargar"){
    if(d.tipo){leerForm();f.tipo=d.tipo;if(f.tipo==="ingreso"){f.moneda="ARS";f.cuotas=1;f.compartida=false}return render(true)}
    if(d.ingtipo){leerForm();f.ingTipo=d.ingtipo;return render(true)}
    if(d.moneda){leerForm();f.moneda=d.moneda;return render(true)}
    if(d.rubro){leerForm();f.rubro=d.rubro;f.touchedRubro=true;if(!f.touchedPersona)f.persona=personaDef(f.rubro);return render(true)}
    if(d.persona){leerForm();f.persona=d.persona;f.touchedPersona=true;return render(true)}
    if(d.fecha){leerForm();f.fecha=d.fecha;S.otraFecha=false;return render(true)}
    if(d.cta){leerForm();f.cuenta=d.cta;S.pickCuenta=false;return render(true)}
    if(d.key)return calcKey(d.key);
  }
  const act=d.act;if(!act)return;
  if(act==="syncNow"){await Sync.push(true);return render(true)}
  if(act==="syncPull"){S.confirmPull=true;return render(true)}
  if(act==="pullNo"){S.confirmPull=false;return render(true)}
  if(act==="pullSi"){S.confirmPull=false;const n=await Sync.pull();if(n>=0)toast(`Listo: ${n} registros traídos de la planilla`);return render(true)}
  if(act==="calc"){leerForm();S.calc=!S.calc;return render(true)}
  if(act==="masRub"){leerForm();S.showAllRub=true;return render(true)}
  if(act==="menosRub"){leerForm();S.showAllRub=false;return render(true)}
  if(act==="pickCuenta"){leerForm();S.pickCuenta=!S.pickCuenta;return render(true)}
  if(act==="otraFecha"){leerForm();S.otraFecha=true;render(true);const i=$("#iFecha");if(i){i.focus();try{i.showPicker()}catch{}}return}
  if(act==="archivar"){leerForm();S.confirmArch=true;return render(true)}
  if(act==="archNo"){leerForm();S.confirmArch=false;return render(true)}
  if(act==="borrar"){leerForm();S.confirmBorrar=true;S.confirmArch=false;return render(true)}
  if(act==="papelTodos"){const xs=enPapelera();const all=S.papelSel&&S.papelSel.size===xs.length;S.papelSel=new Set(all?[]:xs.map(x=>x.mes+"|"+x.id));S.confirmElimSel=false;return render(true)}
  if(act==="recupSel"){const ks=[...(S.papelSel||[])];try{for(const k of ks){const[m,id]=k.split("|");await S.db.doc(`meses/${m}/movs/${id}`).update({archivado:false,borrado:null,actualizado:Date.now()})}toast(`Recuperados: ${ks.length}`)}catch(err){toast("No se pudo: "+(err.message||err.code))}S.papelSel=new Set();return render(true)}
  if(act==="elimSel"){S.confirmElimSel=true;return render(true)}
  if(act==="elimSelNo"){S.confirmElimSel=false;return render(true)}
  if(act==="elimSelSi"){const xs=[...(S.papelSel||[])].map(papelPorId).filter(Boolean);try{await eliminarDef(xs);toast(`Eliminados para siempre: ${xs.length}`)}catch(err){toast("No se pudo: "+(err.message||err.code))}S.papelSel=new Set();S.confirmElimSel=false;return render(true)}
  if(act==="vaciar"){S.confirmVaciar=true;return render(true)}
  if(act==="vaciarNo"){S.confirmVaciar=false;return render(true)}
  if(act==="vaciarSi"){const xs=enPapelera();try{await eliminarDef(xs);toast(`Papelera vaciada (${xs.length})`)}catch(err){toast("No se pudo: "+(err.message||err.code))}S.confirmVaciar=false;return render(true)}
  if(act==="elim"){S.confirmElim=true;return render(true)}
  if(act==="elimNo"){S.confirmElim=false;return render(true)}
  if(act==="elimSi"){const x=papelPorId(scr().k);if(x){try{await eliminarDef([x]);toast("Eliminado para siempre")}catch(err){return toast("No se pudo: "+(err.message||err.code))}}S.confirmElim=false;return back()}
  if(act==="borrarNo"){leerForm();S.confirmBorrar=false;return render(true)}
  if(act==="borrarSi"){const ed=S.editing;
    try{await S.db.doc(`meses/${ed.mes}/movs/${ed.id}`).update({archivado:true,borrado:Date.now(),actualizado:Date.now()});toast("Borrado. Está en la papelera.")}catch(err){return toast("No se pudo: "+(err.message||err.code))}
    S.editing=null;S.form=null;S.confirmBorrar=false;return back()}
  if(act==="archSi"||act==="restaurar"){const ed=S.editing;const a=act==="archSi";
    try{await S.db.doc(`meses/${ed.mes}/movs/${ed.id}`).update({archivado:a,actualizado:Date.now()});toast(a?"Archivado. Se puede restaurar.":"Restaurado")}catch(err){return toast("No se pudo: "+(err.message||err.code))}
    S.editing=null;S.form=null;S.confirmArch=false;return back()}
  if(act==="ctaArch"){const c=S.ce;const all=cuentas(true).map(x=>x.id===c.id?{...x,archivada:!x.archivada}:x);S.config.cuentasV2=all;try{await guardarConfig();toast(c.archivada?"Cuenta restaurada":"Cuenta archivada")}catch{return}S.stack=[];S.tab="cuentas";return render(true)}
  if(act==="subBaja")return subBaja();
  if(act==="habToggle"){const h=S.he;S.hab.items=S.hab.items.map(x=>x.id===h.id?{...x,activo:!x.activo}:x);try{await guardarHab()}catch{return}return back()}
  if(act==="csv"){const r=rango();const xs=periodoMeses().flatMap(movsDe).filter(x=>!x.archivado&&x.fecha>=r.desde&&x.fecha<r.hasta);
    const cols=["fecha","tipo","monto","moneda","montoOrig","desc","rubro","persona","grupo","cuenta","ingTipo","desde","hacia","nota"];
    const csv=[cols.join(";"),...xs.map(x=>cols.map(c=>String(x[c]??"").replace(/;/g,",")).join(";"))].join("\n");
    try{await navigator.clipboard.writeText(csv);toast("CSV copiado")}catch{toast("No se pudo copiar")}}
});
$("#view").addEventListener("input",e=>{const id=e.target.id;
  if(id==="iDesc"&&S.form){S.form.desc=e.target.value;if(!S.form.touchedRubro){const sg=suggest(S.form.desc);const prev=S.form.rubro;S.form.rubro=sg?sg.rubro:null;if(!S.form.touchedPersona)S.form.persona=sg?(sg.persona||personaDef(sg.rubro)):null;
    if(prev!==S.form.rubro){const pos=e.target.selectionStart;leerForm();render(true);const i=$("#iDesc");if(i){i.focus();i.setSelectionRange(pos,pos)}}}paintSug()}});
$("#view").addEventListener("focusin",e=>{if(e.target.id==="iDesc"){paintSug();const el=e.target;setTimeout(()=>{try{el.scrollIntoView({block:"start",behavior:"smooth"})}catch{}},250)}});
$("#view").addEventListener("focusout",e=>{if(e.target.id==="iDesc")setTimeout(()=>{if(document.activeElement&&document.activeElement.id==="iDesc")return;const b=document.getElementById("descSug");if(b)b.hidden=true},150)});
$("#view").addEventListener("pointerdown",e=>{if(e.target.closest("[data-dsug]"))e.preventDefault()});
$("#view").addEventListener("change",e=>{const id=e.target.id;
  if(e.target.dataset&&e.target.dataset.psel!==undefined){const k=e.target.dataset.psel;S.papelSel=S.papelSel||new Set();e.target.checked?S.papelSel.add(k):S.papelSel.delete(k);S.confirmElimSel=false;return render(true)}
  if(id==="iArch"){S.showArch=e.target.checked;return render(true)}
  if(S.form&&scr().name==="cargar"&&["iCuotas","iComp","iFecha"].includes(id)){leerForm();if(id==="iComp")S.form.compartida=e.target.checked;return render(true)}
  if((id==="tDesde"||id==="tHacia")&&S.tf){leerTf();return render(true)}});
function leerTf(){const g=i=>document.getElementById(i);const t=S.tf;if(!t)return;t.desde=g("tDesde").value;t.hacia=g("tHacia").value;t.monto=g("tMonto").value;if(g("tDest"))t.montoDest=g("tDest").value;t.fecha=g("tFecha").value||t.fecha;t.nota=g("tNota").value}
function leerCta(){const g=i=>document.getElementById(i);const c=S.ce;if(!c||!g("cNombre"))return;c.nombre=g("cNombre").value.trim();c.moneda=g("cMon").value;const s=g("cSaldo").value.trim();c.saldoInicial=s===""?null:evalMonto(s.replace(/^−/,"-"));c.desde=g("cDesde").value||hoyISO();c.incluir=g("cIncl").checked}
$("#view").addEventListener("submit",async e=>{e.preventDefault();const id=e.target.id;const g=i=>document.getElementById(i);
  if(id==="fMov")return guardar();
  if(id==="fSub")return subGuardar();
  if(id==="fSync"){Sync.cfg.url=g("sUrl").value.trim();Sync.cfg.key=g("sKey").value.trim();await Sync.save();const r=await Sync.ping();toast(r);
    if(r.startsWith("Conectado")&&!S.db.has("config/app")){const n=await Sync.pull();if(n>=0)toast(`Conectado. Traje ${n} registros de la planilla`)}
    Sync.push();return render(true)}
  if(id==="fTf"){leerTf();const t=S.tf;const n=evalMonto(t.monto);if(!(n>0))return toast("Poné un monto mayor a cero.");if(t.desde===t.hacia)return toast("Elegí dos cuentas distintas.");
    const md=g("tDest")?evalMonto(t.montoDest):null;if(g("tDest")&&!(md>0))return toast("Poné cuánto llega a la otra cuenta.");
    const doc={tipo:"transferencia",fecha:t.fecha,mes:mesDe(t.fecha),desde:t.desde,hacia:t.hacia,monto:n,montoDestino:md,nota:t.nota.trim(),archivado:false,origen:"app",creado:Date.now(),actualizado:Date.now()};
    try{subMes(doc.mes);await S.db.collection(`meses/${doc.mes}/movs`).doc().set(doc);toast("Transferencia guardada")}catch(err){return toast("No se guardó: "+(err.message||err.code))}S.tf=null;return back()}
  if(id==="fAjS"){const s=scr();const real=evalMonto(g("aReal").value.replace(/^−/,"-"));if(!isFinite(real))return toast("Poné el saldo real.");const sl=saldos()[s.c];const diff=Math.round((real-sl.v)*100)/100;
    if(!sl.ok){const all=cuentas(true).map(x=>x.nombre===s.c?{...x,saldoInicial:real,desde:hoyISO()}:x);S.config.cuentasV2=all;try{await guardarConfig();toast("Saldo inicial cargado")}catch{return}return back()}
    if(Math.abs(diff)<.01){toast("El saldo ya coincide");return back()}
    const doc={tipo:"ajuste",fecha:hoyISO(),mes:mesDe(hoyISO()),cuenta:s.c,monto:diff,nota:g("aNota").value.trim(),archivado:false,origen:"app",creado:Date.now(),actualizado:Date.now()};
    try{await S.db.collection(`meses/${doc.mes}/movs`).doc().set(doc);toast(`Ajuste de ${fmt(diff)} guardado`)}catch(err){return toast("No se guardó: "+(err.message||err.code))}return back()}
  if(id==="fCta"){leerCta();const c=S.ce;if(!c.nombre)return toast("Poné un nombre.");if(c._nueva&&cuentaPorNombre(c.nombre))return toast("Ya hay una cuenta con ese nombre.");
    if(c.saldoInicial!=null&&!isFinite(c.saldoInicial))return toast("El saldo no es un número.");
    const{_nueva,...limpia}=c;const all=cuentas(true);S.config.cuentasV2=_nueva?[...all,limpia]:all.map(x=>x.id===c.id?limpia:x);
    try{await guardarConfig();toast("Cuenta guardada")}catch{return}S.ce=null;return back()}
  if(id==="fHab"){const h=S.he;h.desc=g("hDesc").value.trim();h.monto=evalMonto(g("hMonto").value);h.dia=Math.min(31,Math.max(1,+g("hDia").value||1));h.frec=g("hFrec").value;h.dsem=+g("hDsem").value;h.rubro=g("hRubro").value;h.persona=g("hPers").value;h.cuenta=g("hCta").value;
    if(!h.desc||!(h.monto>0))return toast("Poné descripción y monto.");const{_nuevo,...l}=h;S.hab.items=_nuevo?[...S.hab.items,l]:S.hab.items.map(x=>x.id===h.id?l:x);
    try{await guardarHab();toast("Guardado")}catch{return}S.he=null;return back()}
  if(id==="fAj"){const n=i=>{const v=evalMonto(g(i).value);return isFinite(v)&&v>=0?v:null};const o={salidas:n("tSalidas"),comida:n("tComida"),joda:n("tJoda"),bajon:n("tBajon"),flores:n("tFlores"),floresExtra:n("tFloresX"),eventuales:n("tEvent"),ropaTrim:n("tRopa")};
    if(Object.values(o).some(v=>v==null))return toast("Revisá los montos.");S.config.topesMati=o;try{await guardarConfig();toast("Topes guardados")}catch{return}return back()}
});
// transferencias y ajustes: vista simple con archivar
function vMovSimple(){const x=S.editing;if(!x)return "";
  return `<header class="top"><button type="button" class="back" data-back aria-label="Volver">←</button><h2 style="flex:1">${x.tipo==="transferencia"?"Transferencia":"Ajuste de saldo"}</h2></header>
  <div class="card"><div>${movRow(x)}</div><p class="small muted" style="margin:0">${esc(fCorta(x.fecha))}${x.nota?" · "+esc(x.nota):""}. Para corregirla, archivala y cargala de nuevo.</p>${archBloque(x)}</div>`}

// ================= arranque =================
(async()=>{
  try{S.db=await LocalDB.open()}catch(e){$("#view").innerHTML=`<div class="card state">No se pudo abrir el almacenamiento del celu (${esc(e.message||e)}). Revisá que el navegador no esté en modo incógnito.</div>`;return}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  await Sync.load();
  const db=S.db;
  db.doc("config/app").onSnapshot(s=>{if(s.exists){const d=s.data();S.config={...structuredClone(DEF_CONFIG),...structuredClone(d),params:{...DEF_CONFIG.params,...(d.params||{})}};ensureSubs()}render(false)});
  db.doc("config/memo").onSnapshot(s=>{if(s.exists)S.memo=(s.data().items||[]).map(x=>[x.k,x.r,x.p])});
  db.doc("config/descs").onSnapshot(s=>{if(s.exists)S.descs=structuredClone(s.data().items||{})});
  db.doc("config/suscripciones").onSnapshot(s=>{if(s.exists)S.subsDoc={items:structuredClone(s.data().items||[]),v10:!!s.data().v10};render(false)});
  db.doc("config/habituales").onSnapshot(s=>{if(s.exists){const d=s.data();S.hab={items:structuredClone(d.items||[]),saltados:[...(d.saltados||[])],v10:!!d.v10}}render(false)});
  try{history.replaceState({d:0},"")}catch{}
  setTimeout(migrarV10,2500);setTimeout(migrarV10,20000);setTimeout(migrarV12,4000);setTimeout(migrarV12,25000);
  ensureSubs();S.ready=true;render(true);
  Sync.start();
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
